syntax = "proto3";

option csharp_namespace = "Ticketing.Shared.Grpc";

package ticketing;

// Service principal pour les validations de tickets
service TicketingService {
  // Validation unitaire d'un ticket (unary)
  rpc ValidateTicket (ValidateTicketRequest) returns (ValidateTicketResponse);

  // Validation en batch (stream client → unary)
  rpc ValidateTicketBatch (stream ValidateTicketRequest) returns (BatchValidationResponse);

  // Stream bidirectionnel pour validations en temps réel
  rpc ValidateTicketStream (stream ValidateTicketRequest) returns (stream ValidateTicketResponse);

  // Récupération du solde d'un compte
  rpc GetAccountBalance (GetAccountBalanceRequest) returns (GetAccountBalanceResponse);

  // Rechargement d'un compte
  rpc RechargeAccount (RechargeAccountRequest) returns (RechargeAccountResponse);

  // Health check
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
}

// ============================================================================
// Messages pour validation de tickets
// ============================================================================

message ValidateTicketRequest {
  // ID unique de la validation (pour idempotence) - généré côté client
  string validation_id = 1;

  // ID de l'utilisateur (account-based)
  string user_id = 2;

  // ID du validateur (zone géographique / groupe)
  string validator_id = 3;

  // Timestamp de la validation (Unix epoch milliseconds)
  int64 timestamp_ms = 4;

  // Type de ticket demandé
  TicketType ticket_type = 5;

  // Métadonnées additionnelles (ex: ligne de bus, station, zone tarifaire)
  map<string, string> metadata = 6;

  // Correlation ID pour tracing distribué
  string correlation_id = 7;
}

message ValidateTicketResponse {
  // ID de la validation (echo de la requête)
  string validation_id = 1;

  // Statut de la validation
  ValidationStatus status = 2;

  // Nouveau solde du compte après validation
  double new_balance = 3;

  // Nombre de tickets restants (si applicable)
  int32 remaining_tickets = 4;

  // Message d'erreur si échec
  string error_message = 5;

  // Code d'erreur si échec
  ErrorCode error_code = 6;

  // Timestamp de traitement côté serveur
  int64 processed_at_ms = 7;

  // Latence de traitement (ms) - pour observabilité
  double processing_latency_ms = 8;

  // ID du grain Orleans qui a traité la requête (pour debug)
  string grain_id = 9;
}

message BatchValidationResponse {
  // Nombre total de validations traitées
  int32 total_processed = 1;

  // Nombre de succès
  int32 success_count = 2;

  // Nombre d'échecs
  int32 failure_count = 3;

  // Latence moyenne (ms)
  double average_latency_ms = 4;

  // Latence p99 (ms)
  double p99_latency_ms = 5;

  // Détails des validations (optionnel, pour debugging)
  repeated ValidateTicketResponse results = 6;
}

// ============================================================================
// Messages pour gestion de compte
// ============================================================================

message GetAccountBalanceRequest {
  string user_id = 1;
  string correlation_id = 2;
}

message GetAccountBalanceResponse {
  string user_id = 1;
  double balance = 2;
  int32 total_tickets = 3;
  AccountStatus account_status = 4;
  int64 last_validation_timestamp_ms = 5;
  int32 validation_count = 6;
}

message RechargeAccountRequest {
  string user_id = 1;
  double amount = 2;
  string transaction_id = 3; // Pour idempotence
  string correlation_id = 4;
}

message RechargeAccountResponse {
  bool success = 1;
  double new_balance = 2;
  string error_message = 3;
  string transaction_id = 4;
}

// ============================================================================
// Health check
// ============================================================================

message HealthCheckRequest {
  string service_name = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  int32 active_grains = 4;
  map<string, string> metrics = 5;
}

// ============================================================================
// Enums
// ============================================================================

enum TicketType {
  TICKET_TYPE_UNSPECIFIED = 0;
  TICKET_TYPE_SINGLE_JOURNEY = 1;    // Voyage simple
  TICKET_TYPE_DAY_PASS = 2;           // Pass journée
  TICKET_TYPE_WEEK_PASS = 3;          // Pass semaine
  TICKET_TYPE_MONTH_PASS = 4;         // Pass mois
  TICKET_TYPE_ANNUAL_PASS = 5;        // Pass annuel
}

enum ValidationStatus {
  VALIDATION_STATUS_UNSPECIFIED = 0;
  VALIDATION_STATUS_SUCCESS = 1;           // Validation réussie
  VALIDATION_STATUS_INSUFFICIENT_BALANCE = 2; // Solde insuffisant
  VALIDATION_STATUS_INVALID_TICKET = 3;    // Ticket invalide
  VALIDATION_STATUS_EXPIRED_TICKET = 4;    // Ticket expiré
  VALIDATION_STATUS_DUPLICATE_VALIDATION = 5; // Validation dupliquée (idempotence)
  VALIDATION_STATUS_ACCOUNT_SUSPENDED = 6;  // Compte suspendu
  VALIDATION_STATUS_SYSTEM_ERROR = 7;       // Erreur système
}

enum ErrorCode {
  ERROR_CODE_NONE = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_USER_NOT_FOUND = 2;
  ERROR_CODE_INSUFFICIENT_FUNDS = 3;
  ERROR_CODE_PERSISTENCE_ERROR = 4;
  ERROR_CODE_TIMEOUT = 5;
  ERROR_CODE_RATE_LIMIT_EXCEEDED = 6;
  ERROR_CODE_INTERNAL_ERROR = 99;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_SUSPENDED = 2;
  ACCOUNT_STATUS_CLOSED = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNKNOWN = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}
