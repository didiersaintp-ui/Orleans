apiVersion: v1
kind: Service
metadata:
  name: ticketing-api
  namespace: ticketing
  labels:
    app.kubernetes.io/name: ticketing
    app.kubernetes.io/component: api
  annotations:
    # For cloud load balancers (AWS ELB, GCP LB, Azure LB)
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http2"
spec:
  type: LoadBalancer  # Change to ClusterIP for local dev or NodePort
  selector:
    app: ticketing-api
  ports:
    - name: grpc
      port: 5000
      targetPort: 5000
      protocol: TCP
      # nodePort: 30500  # Uncomment for NodePort type
    - name: metrics
      port: 5001
      targetPort: 5001
      protocol: TCP
  sessionAffinity: None
