apiVersion: v1
kind: Service
metadata:
  name: orleans-headless
  namespace: ticketing
  labels:
    app.kubernetes.io/name: ticketing
    app.kubernetes.io/component: silo
    app.kubernetes.io/part-of: orleans-cluster
spec:
  clusterIP: None  # Headless service for Orleans clustering
  publishNotReadyAddresses: true  # Important: allow Orleans to discover joining silos
  selector:
    app: orleans-silo
  ports:
    - name: orleans-silo
      port: 11111
      targetPort: 11111
      protocol: TCP
    - name: orleans-gateway
      port: 30000
      targetPort: 30000
      protocol: TCP
    - name: metrics
      port: 5001
      targetPort: 5001
      protocol: TCP
