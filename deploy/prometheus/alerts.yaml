groups:
  - name: ticketing_alerts
    interval: 30s
    rules:
      # ========================================================================
      # High Priority Alerts
      # ========================================================================

      - alert: HighErrorRate
        expr: |
          (
            rate(ticketing_validations_total{status="error"}[5m])
            /
            rate(ticketing_validations_total[5m])
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            rate(ticketing_validation_duration_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High P99 latency detected"
          description: "P99 latency is {{ $value }}s (threshold: 100ms)"

      - alert: HighP999Latency
        expr: |
          histogram_quantile(0.999,
            rate(ticketing_validation_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Extremely high P99.9 latency detected"
          description: "P99.9 latency is {{ $value }}s (threshold: 500ms)"

      - alert: LowSuccessRate
        expr: |
          (
            rate(ticketing_validations_total{status="success"}[5m])
            /
            rate(ticketing_validations_total[5m])
          ) < 0.99
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Low success rate detected"
          description: "Success rate is {{ $value | humanizePercentage }} (threshold: 99%)"

      # ========================================================================
      # Infrastructure Alerts
      # ========================================================================

      - alert: HighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total{namespace="ticketing"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"

      - alert: HighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes{namespace="ticketing"}
            /
            container_spec_memory_limit_bytes{namespace="ticketing"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"

      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="ticketing"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"

      - alert: PodNotReady
        expr: |
          kube_pod_status_phase{namespace="ticketing", phase!="Running"} == 1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod is in {{ $labels.phase }} state"

      # ========================================================================
      # Orleans Silo Alerts
      # ========================================================================

      - alert: SiloDown
        expr: |
          up{job="orleans-silo"} == 0
        for: 1m
        labels:
          severity: critical
          component: orleans
        annotations:
          summary: "Orleans Silo {{ $labels.instance }} is down"
          description: "Silo has been unreachable for 1 minute"

      - alert: LowSiloCount
        expr: |
          count(up{job="orleans-silo"} == 1) < 2
        for: 2m
        labels:
          severity: critical
          component: orleans
        annotations:
          summary: "Low Orleans Silo count"
          description: "Only {{ $value }} silos are running (minimum: 2)"

      - alert: HighGrainActivationRate
        expr: |
          rate(orleans_grain_activations[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          component: orleans
        annotations:
          summary: "High grain activation rate"
          description: "Grain activation rate is {{ $value }}/sec (may indicate memory pressure)"

      # ========================================================================
      # Redis Alerts
      # ========================================================================

      - alert: RedisDown
        expr: |
          redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for 1 minute"

      - alert: RedisHighMemoryUsage
        expr: |
          (
            redis_memory_used_bytes
            /
            redis_memory_max_bytes
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      - alert: RedisHighLatency
        expr: |
          redis_command_duration_seconds_sum / redis_command_duration_seconds_count > 0.01
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis high latency detected"
          description: "Average command latency is {{ $value }}s"

      # ========================================================================
      # API Availability Alerts
      # ========================================================================

      - alert: APIDown
        expr: |
          up{job="ticketing-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API {{ $labels.instance }} is down"
          description: "API has been unreachable for 1 minute"

      - alert: NoHealthyAPIPods
        expr: |
          count(up{job="ticketing-api"} == 1) < 1
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "No healthy API pods"
          description: "All API pods are down"

      # ========================================================================
      # Business Logic Alerts
      # ========================================================================

      - alert: InsufficientBalanceSpike
        expr: |
          rate(ticketing_validations_total{status="insufficient_balance"}[5m]) > 100
        for: 10m
        labels:
          severity: info
          component: business
        annotations:
          summary: "High rate of insufficient balance errors"
          description: "{{ $value }} insufficient balance errors/sec (may indicate users need recharge)"

      - alert: NoValidationsReceived
        expr: |
          rate(ticketing_validations_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "No validations received"
          description: "No validation requests in the last 5 minutes (system may be idle or broken)"
