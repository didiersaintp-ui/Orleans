# ============================================================================
# Default values for Orleans Ticketing
# ============================================================================

# Global settings
global:
  environment: production

# Image settings
image:
  registry: ghcr.io
  repository: your-org/ticketing
  tagSilo: latest
  tagApi: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

# Orleans Silo configuration
silo:
  replicaCount: 3
  minReplicas: 3
  maxReplicas: 50

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: true
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  terminationGracePeriodSeconds: 120

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5001"
    prometheus.io/path: "/metrics"

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - orleans-silo
            topologyKey: kubernetes.io/hostname

# API configuration
api:
  replicaCount: 2
  minReplicas: 2
  maxReplicas: 20

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  autoscaling:
    enabled: true
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  terminationGracePeriodSeconds: 30

  service:
    type: LoadBalancer
    port: 5000
    metricsPort: 5001
    annotations: {}

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5001"
    prometheus.io/path: "/metrics"

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - ticketing-api
            topologyKey: kubernetes.io/hostname

# Orleans configuration
orleans:
  clusterId: ticketing-cluster
  serviceId: ticketing-service

# Redis configuration
redis:
  enabled: true
  host: redis-master
  port: 6379
  password: ""
  # Use external Redis cluster
  external:
    enabled: false
    host: redis-cluster.prod.svc.cluster.local
    port: 6379

# Observability
observability:
  jaeger:
    enabled: true
    endpoint: http://jaeger-collector:4317

  prometheus:
    enabled: true

  grafana:
    enabled: true

# Security
security:
  networkPolicy:
    enabled: true

  rbac:
    create: true

  tls:
    enabled: false
    secretName: ticketing-tls

# Secrets (should be overridden in production)
secrets:
  redisPassword: changeme

# Resource quotas (optional)
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "100"
    requests.memory: "200Gi"
    limits.cpu: "200"
    limits.memory: "400Gi"

# Monitoring & Alerting
monitoring:
  alerts:
    enabled: true
    slackWebhook: ""
    pagerdutyKey: ""
